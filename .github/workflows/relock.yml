# Одноразовый: пересобрать package-lock.json на Linux (полные optional-депы
# @emnapi/* для wasm-движка Tailwind), чтобы деплой мог использовать строгий npm ci.
# Запуск вручную: gh workflow run relock.yml. После забора лока этот файл удаляется.
name: relock

on:
  workflow_dispatch:

jobs:
  relock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: rm -f package-lock.json && npm install --no-fund --package-lock-only
      - uses: actions/upload-artifact@v4
        with:
          name: lockfile
          path: package-lock.json
